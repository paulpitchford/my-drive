[package]
name = "mydrive-daemon"
description = "The my-drive daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A library beside the binary, so tests can run the daemon in-process (WP-014).
[lib]
path = "src/lib.rs"

[[bin]]
name = "mydrived"
path = "src/main.rs"

# Prepared by WP-014 so the M1 daemon work package does not edit this file. No direct
# dependency on mydrive-core: the crate diagram has no daemon-to-core edge (ADR-0004 R3).
[dependencies]
anyhow.workspace = true
mydrive-engine.workspace = true
mydrive-ipc.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true

[dev-dependencies]
mydrive-graph-sim.workspace = true
tempfile.workspace = true

[lints]
workspace = true
