[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/paulpitchford/my-drive"
publish = false

# The dependency stack fixed by ADR-0003. Crates inherit with `name.workspace = true`.
# Adding a dependency that is not listed here needs the lead's approval (ADR-0018).
[workspace.dependencies]
mydrive-core = { path = "crates/mydrive-core" }
mydrive-graph = { path = "crates/mydrive-graph" }
mydrive-store = { path = "crates/mydrive-store" }
mydrive-engine = { path = "crates/mydrive-engine" }
mydrive-vfs = { path = "crates/mydrive-vfs" }
mydrive-ipc = { path = "crates/mydrive-ipc" }
mydrive-graph-sim = { path = "crates/mydrive-graph-sim" }

anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
fuser = "0.18.0"
futures-core = "0.3.34"
proptest = "1.12.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false }
rusqlite = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
tracing = "0.1.44"
url = "2.5.8"
zbus = "6.3.0"

[workspace.lints.cargo]
# The pinned stack above is declared before every crate uses it.
unused_workspace_dependencies = "allow"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
