name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    env:
      # The FUSE smoke test fails instead of skipping when it cannot mount (WP-010), so a
      # runner without FUSE cannot pass silently. See docs/process/ci-fuse.md.
      MYDRIVE_REQUIRE_FUSE: "1"
      # The protocol README examples test fails instead of skipping when a tool it needs is
      # missing (WP-013), so the catalogue's shell and Python loops are always run here.
      MYDRIVE_REQUIRE_README_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      # jq and socat for crates/mydrive-ipc/tests/readme_examples.rs; bash, python3 and
      # timeout are on the runner already.
      - name: Install the README examples' tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq socat
      # rustup reads rust-toolchain.toml and installs the pinned toolchain on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Crate dependencies against the overview's diagram, and forbid(unsafe_code) (WP-012).
      - run: python3 scripts/check_arch.py
      # The scripts' own tests build fixture workspaces with cargo, so they run here.
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check no FUSE mount is left behind
        if: always()
        # findmnt -t exits 0 even when nothing matches, so read mountinfo directly.
        run: |
          if grep ' - fuse\.mydrive-smoke ' /proc/self/mountinfo; then
            echo "::error::FUSE smoke test left a mount behind"
            exit 1
          fi

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: Docs cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
      # ADR rule-to-test coverage (ADR-0017 R3). Report only until the lead makes it fail.
      - run: python3 scripts/rule_coverage.py --verbose
