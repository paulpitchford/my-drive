name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    env:
      # The FUSE smoke test fails instead of skipping when it cannot mount (WP-010), so a
      # runner without FUSE cannot pass silently. See docs/process/ci-fuse.md.
      MYDRIVE_REQUIRE_FUSE: "1"
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain on first use.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Check no FUSE mount is left behind
        if: always()
        # findmnt -t exits 0 even when nothing matches, so read mountinfo directly.
        run: |
          if grep ' - fuse\.mydrive-smoke ' /proc/self/mountinfo; then
            echo "::error::FUSE smoke test left a mount behind"
            exit 1
          fi

  deny:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    name: Docs cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_docs.py
