# cargo-deny configuration. Run with `just deny`.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# The allow list is set ahead of the dependencies that will need it.
unused-allowed-license = "allow"
# Licences compatible with distributing the combined work under GPL-3.0-or-later (ADR-0002).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
